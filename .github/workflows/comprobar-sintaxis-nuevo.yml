name: Comprobar JavaScript de nuevo.html

on:
  push:
    branches:
      - main
      - mejora-navegador
  pull_request:
    branches:
      - main
      - mejora-navegador
  workflow_dispatch:

jobs:
  sintaxis:
    runs-on: ubuntu-latest
    # node --test NO corta por su cuenta: si una prueba se queda esperando una
    # respuesta que no llega, el trabajo seguiria ahi seis horas -lo que pone
    # GitHub por defecto- gastando minutos para nada. Con esto se corta en 10.
    timeout-minutes: 10
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Comprobar los bloques JavaScript de nuevo.html
        run: |
          python3 - <<'PY'
          import pathlib
          import re

          html = pathlib.Path("nuevo.html").read_text(encoding="utf-8")
          bloques = re.findall(
              r"<script\b(?![^>]*\bsrc\s*=)[^>]*>(.*?)</script\s*>",
              html,
              flags=re.IGNORECASE | re.DOTALL,
          )
          bloques = [bloque for bloque in bloques if bloque.strip()]
          if not bloques:
              raise SystemExit("nuevo.html no contiene bloques JavaScript inline para comprobar")
          for numero, bloque in enumerate(bloques, 1):
              pathlib.Path(f"/tmp/trabakutik-inline-{numero}.js").write_text(bloque, encoding="utf-8")
          print(f"Se comprobarán {len(bloques)} bloques JavaScript inline")
          PY
          for archivo in /tmp/trabakutik-inline-*.js; do
            node --check "$archivo"
          done
      - name: Comprobar rutas propias y avisos de giro
        run: node --test tests/*.test.cjs

  navegador:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preparar Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.64.1
          npx playwright install --with-deps chromium
      - name: Probar creador, guardado, grabación y apertura sin conexión
        run: node scripts/test-browser.cjs
      - name: Guardar capturas de la revisión
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-navegador
          path: .test-artifacts/*.png
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

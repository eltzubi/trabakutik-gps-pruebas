name: Sincronizar rutas de Trabakutik

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/sincronizar-rutas.yml
  schedule:
    # UNA VEZ POR HORA, no cada quince minutos. Cada cuarto de hora son 96
    # pasadas al dia bajandose las rutas de trabakutik.com para, casi siempre,
    # no encontrar ningun cambio. Las rutas se publican cada varios dias.
    # El minuto 23 y no el 0 a proposito: a en punto es cuando se amontona
    # todo el mundo en los servidores de GitHub y las pasadas se retrasan.
    # Si hace falta antes, el boton «Run workflow» la dispara al momento.
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sincronizar-rutas
  cancel-in-progress: false

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio GPS
        uses: actions/checkout@v4
      - name: Descargar y validar las rutas y sus nombres
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import urllib.request

          fuentes = {
              "data/trailhead.json": "https://raw.githubusercontent.com/eltzubi/Rutas-Mallabia/main/data/trailhead.json",
              "data/rutas.json": "https://raw.githubusercontent.com/eltzubi/Rutas-Mallabia/main/data/rutas.json",
              # Las alturas van CON los trazados y en el mismo viaje: el editor
              # las lee por posicion dentro del array, asi que unas alturas de
              # otra version de los tracks no valen. Faltaban: el GPS tenia 68
              # de las 70 rutas -sin lejarreta ni zengotitagarai- porque este
              # workflow no las traia.
              "data/alturas.json": "https://raw.githubusercontent.com/eltzubi/Rutas-Mallabia/main/data/alturas.json",
          }

          descargados = {}
          for nombre, url in fuentes.items():
              req = urllib.request.Request(
                  url,
                  headers={"User-Agent": "Trabakutik-GPS-Sync/1.0", "Cache-Control": "no-cache"},
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  raw = response.read()
              data = json.loads(raw)

              if nombre.endswith("alturas.json"):
                  if not isinstance(data, dict) or not data:
                      raise SystemExit("alturas.json no contiene rutas; no se sustituye ningun archivo")
                  for slug, alturas in data.items():
                      if not isinstance(alturas, list) or not alturas:
                          raise SystemExit(f"alturas.json: {slug} sin alturas")
                      if not all(isinstance(x, (int, float)) for x in alturas):
                          raise SystemExit(f"alturas.json: {slug} tiene alturas que no son numeros")
                  resumen = f"{len(data)} perfiles"
              elif nombre.endswith("trailhead.json"):
                  tracks = data.get("tracks") if isinstance(data, dict) else None
                  if not isinstance(tracks, list) or not tracks:
                      raise SystemExit("trailhead.json sin rutas; no se sustituye ningún archivo")
                  for index, track in enumerate(tracks):
                      if not isinstance(track, dict) or not isinstance(track.get("href"), str) or not track["href"].endswith(".html"):
                          raise SystemExit(f"trailhead.json: la ruta {index} no tiene ficha HTML")
                      points = track.get("points")
                      if not isinstance(points, list) or len(points) < 2:
                          raise SystemExit(f"trailhead.json: la ruta {index} no tiene trazado suficiente")
                      for point in points:
                          if not isinstance(point, list) or len(point) < 2 or not all(isinstance(x, (int, float)) for x in point[:2]):
                              raise SystemExit(f"trailhead.json: coordenadas incorrectas en la ruta {index}")
                  resumen = f"{len(tracks)} trazados"
              else:
                  if not isinstance(data, dict):
                      raise SystemExit("rutas.json no contiene un objeto; no se sustituye ningún archivo")
                  idiomas = [data.get("es"), data.get("eu")]
                  if not all(isinstance(rutas, dict) and rutas for rutas in idiomas):
                      raise SystemExit("rutas.json debe incluir rutas en castellano y euskera")
                  if set(idiomas[0]) != set(idiomas[1]):
                      raise SystemExit("rutas.json tiene listas distintas en castellano y euskera")
                  for idioma, rutas in zip(("es", "eu"), idiomas):
                      for slug, ruta in rutas.items():
                          if not isinstance(ruta, dict) or not all(isinstance(ruta.get(campo), str) and ruta[campo] for campo in ("h", "n", "s")):
                              raise SystemExit(f"rutas.json: datos incompletos para {idioma}/{slug}")
                          if not ruta["h"].endswith(".html"):
                              raise SystemExit(f"rutas.json: ficha HTML incorrecta para {idioma}/{slug}")
                  resumen = f"{len(idiomas[0])} nombres bilingües"

              descargados[nombre] = (raw, data, resumen)

          # Y las alturas tienen que cuadrar CON ESTOS trazados, una a una: el
          # editor las usa por posicion. Si no cuadran no se escribe nada, que
          # es mejor quedarse con lo de antes que mezclar dos versiones.
          tracks = descargados["data/trailhead.json"][1]["tracks"]
          alturas = descargados["data/alturas.json"][1]
          faltan = []
          descuadradas = []
          for track in tracks:
              slug = track["href"].rsplit("/", 1)[-1][:-5]
              if slug not in alturas:
                  faltan.append(slug)
              elif len(alturas[slug]) != len(track["points"]):
                  descuadradas.append(slug)
          if descuadradas:
              raise SystemExit("alturas.json no cuadra con trailhead.json: " + ", ".join(descuadradas))
          if faltan:
              print("AVISO: sin alturas para " + ", ".join(faltan))

          # Solo se escriben archivos despues de validar las descargas.
          for nombre, (raw, data, resumen) in descargados.items():
              destino = pathlib.Path(nombre)
              destino.parent.mkdir(parents=True, exist_ok=True)
              try:
                  sin_cambios = destino.exists() and json.loads(destino.read_text(encoding="utf-8")) == data
              except (OSError, json.JSONDecodeError):
                  sin_cambios = False
              if sin_cambios:
                  print(f"{nombre}: ya sincronizado ({resumen})")
              else:
                  destino.write_bytes(raw)
                  print(f"{nombre}: actualizado ({resumen})")
          PY
      - name: Publicar cambios en el navegador GPS
        run: |
          if git diff --quiet -- data/trailhead.json data/rutas.json data/alturas.json; then
            echo "Sin cambios en las rutas"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/trailhead.json data/rutas.json data/alturas.json
          git commit -m "Sincronizar rutas, nombres y alturas desde Trabakutik"
          git push

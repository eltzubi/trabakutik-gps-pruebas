name: Compilar Trabakutik GPS APK
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:
permissions:
  contents: write   # hace falta para publicar la Release con el APK
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Preparar SDK Android del servidor
        run: |
          echo "SDK: $ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Limpiar compilación
        run: gradle clean --no-daemon
      - name: Estilo Kotlin (ktlint)
        run: gradle ktlintCheck --no-daemon
      - name: Análisis estático Kotlin (detekt)
        run: gradle detekt --no-daemon
      - name: Pruebas unitarias
        run: gradle :app:testDebugUnitTest --no-daemon
      - name: Cobertura JaCoCo (mínimo 90%)
        run: gradle :app:jacocoCoverageVerification --no-daemon
      - name: Análisis estático Android Lint
        run: gradle :app:lintDebug --no-daemon
      - name: Pruebas instrumentadas en emulador Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: cd android && gradle :app:connectedDebugAndroidTest --no-daemon
      - name: Compilar APK Debug y Release
        run: gradle :app:assembleDebug :app:assembleRelease --no-daemon
      - name: Comprobar que existe el APK
        run: |
          echo "Archivos generados:"
          find app/build/outputs -type f -maxdepth 6 -print
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Resumen de calidad
        if: always()
        run: python3 scripts/quality_summary.py
      - name: Guardar informes de calidad
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TrabakutikGPS-Informes
          path: |
            android/app/build/reports/
            android/app/build/test-results/
            android/app/build/outputs/androidTest-results/
            android/app/build/outputs/code_coverage/
          retention-days: 30
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: TrabakutikGPS-APK
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: error
      # El artefacto de arriba solo lo puede bajar quien tenga cuenta de
      # GitHub. La Release es publica y, sobre todo, da un enlace FIJO que
      # siempre apunta a la ultima version:
      #   .../releases/latest/download/TrabakutikGPS.apk
      # Un toque y se descarga, sin cuenta y sin buscar nada.
      - name: Publicar la Release con el APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -o 'versionName = "[^"]*"' app/build.gradle.kts | cut -d'"' -f2)
          echo "Version: $VERSION"
          cp app/build/outputs/apk/debug/app-debug.apk TrabakutikGPS.apk
          gh release create "v$VERSION" TrabakutikGPS.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "Trabakutik GPS $VERSION" \
            --notes "Descarga directa: TrabakutikGPS.apk. Instrucciones de instalacion en https://eltzubi.github.io/trabakutik-gps-pruebas/instalar.html" \
            || gh release upload "v$VERSION" TrabakutikGPS.apk --repo "$GITHUB_REPOSITORY" --clobber

name: Compilar Trabakutik GPS APK
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  pull_request:
    branches: [main]
    paths:
      # nuevo.html NO entra aqui: ninguna de las comprobaciones de este
      # trabajo lo lee, y montar el SDK de Android y compilar entero por
      # cambiar la pagina son minutos tirados. Ademas estaba solo en las
      # solicitudes de cambio y no en las subidas a main, asi que lo que
      # fuera que se queria vigilar, en main no se vigilaba.
      - 'android/**'
      - 'tests/background_lifecycle.py'
      - 'tests/sin_senal_gps.py'
      - 'tests/silencio.py'
      - 'tests/regression_tracking.py'
      - 'scripts/test-gasto-bateria.py'
      - 'scripts/test-nombre-descarga.py'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:
# CUIDADO AL ESCRIBIR LOS MENSAJES DE LOS COMMITS. GitHub busca ciertas
# palabras clave en el mensaje -la de saltarse la integracion continua y sus
# variantes- y si las encuentra NO LANZA NINGUN FLUJO de esa subida, ni
# siquiera las pruebas. Basta con que la palabra aparezca, aunque sea dentro
# de una frase que explique que no se esta usando: paso de verdad el 10 de
# noviembre y esa subida se quedo sin compilar y sin pruebas. Si hay que
# nombrarla, se escribe partida o con otras palabras.

permissions:
  contents: write   # hace falta para publicar la Release con el APK
jobs:
  apk:
    runs-on: ubuntu-latest
    # NO ENTRAR EN BUCLE. Este flujo termina dejando un commit con el APK, y
    # desde que ese commit lleva tambien android/app/build.gradle.kts -por el
    # numero de version- cae dentro de android/** y volveria a dispararse el
    # solo, una y otra vez. Ese commit no tiene nada que compilar.
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Publicar TrabakutikGPS.apk')
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
        with:
          # Hace falta algo de historial para saber que ha cambiado en este
          # empujon. Sin los blobs -para los nombres de los ficheros basta con
          # los arboles- porque bajarse los APK viejos serian 23 MB para nada.
          fetch-depth: 50
          filter: blob:none
      - name: Subir el numero de version si ha cambiado el codigo de la app
        # EL NUMERO SUBE SOLO. Antes habia que acordarse a mano, y si se
        # olvidaba pasaba lo peor: la app nueva se compilaba pero NO llegaba a
        # la web -la web solo guarda un APK por numero de version-, asi que la
        # gente seguia bajandose la de antes, sin el arreglo, y no fallaba
        # nada que se viera. Ahora, si el codigo de la app ha cambiado y el
        # numero no, lo sube este paso antes de compilar.
        #
        # Solo cuenta el codigo de la app: si lo unico que cambia es este
        # fichero de flujo, el numero se queda quieto. Si no, cada retoque de
        # aqui publicaria una version nueva que no cambia nada en el movil.
        if: github.event_name == 'push'
        working-directory: ${{ github.workspace }}
        run: |
          ANTES='${{ github.event.before }}'
          APP=si
          if [ -n "$ANTES" ] && [ "$ANTES" != "0000000000000000000000000000000000000000" ] \
             && git cat-file -e "$ANTES^{commit}" 2>/dev/null; then
            TOCADO=$(git diff --name-only "$ANTES" "$GITHUB_SHA" -- \
              android/app/src android/build.gradle.kts \
              android/settings.gradle.kts android/gradle.properties | head -1)
            # De build.gradle.kts solo cuenta lo que NO sea el numero de
            # version: subirlo no es cambiar la app, y contarlo volveria a
            # subirlo en la vuelta siguiente, y asi para siempre.
            OTRO=$(git diff "$ANTES" "$GITHUB_SHA" -- android/app/build.gradle.kts \
              | grep -E '^[+-][^+-]' | grep -v 'versionCode = ' | head -1)
            [ -z "$TOCADO" ] && [ -z "$OTRO" ] && APP=no
          fi
          # Si no se puede saber -un empujon forzado, una rama nueva- se da por
          # cambiado: mas vale un numero de mas que una version sin publicar.
          if [ "$APP" = "no" ]; then
            echo "No ha cambiado el codigo de la app: la version se queda como esta."
            exit 0
          fi
          VERSION=$(grep -o 'versionName = "[^"]*"' android/app/build.gradle.kts | cut -d'"' -f2)
          PUBLICADA=$(grep -o '<!--VER-->[^<]*<!--/VER-->' instalar.html | sed 's/<!--VER-->//; s|<!--/VER-->||')
          if [ "$VERSION" != "$PUBLICADA" ]; then
            echo "La version ya sube: la web tiene la $PUBLICADA y se va a compilar la $VERSION."
            exit 0
          fi
          python3 - <<'PY'
          import pathlib,re
          p=pathlib.Path('android/app/build.gradle.kts');t=p.read_text(encoding='utf-8')
          m=re.search(r'versionCode = (\d+); versionName = "([\d.]+)"',t)
          if not m:
              raise SystemExit('No se encuentra versionCode/versionName en build.gradle.kts')
          partes=m.group(2).split('.');partes[-1]=str(int(partes[-1])+1)
          nueva='.'.join(partes);code=int(m.group(1))+1
          p.write_text(t[:m.start()]+f'versionCode = {code}; versionName = "{nueva}"'+t[m.end():],encoding='utf-8')
          print(f'La version sube sola: {m.group(2)} -> {nueva} (versionCode {code})')
          PY
          echo "### Version subida sola a $(grep -o 'versionName = \"[^\"]*\"' android/app/build.gradle.kts | cut -d'\"' -f2)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar SDK Android del servidor
        run: |
          echo "SDK: $ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Comprobar reposo y reanudación
        working-directory: ${{ github.workspace }}
        run: python3 tests/background_lifecycle.py
      - name: Comprobar los avisos de giro
        working-directory: ${{ github.workspace }}
        run: python3 scripts/test-native-turns.py
      - name: Comprobar el aviso de quedarse sin señal GPS
        working-directory: ${{ github.workspace }}
        run: python3 tests/sin_senal_gps.py
      - name: Comprobar que Silencio calla en el acto
        working-directory: ${{ github.workspace }}
        run: python3 tests/silencio.py
      - name: Comprobar los giros, la ruta y el GPX guardado
        working-directory: ${{ github.workspace }}
        run: python3 tests/regression_tracking.py
      - name: Comprobar el resumen de bateria
        working-directory: ${{ github.workspace }}
        run: python3 scripts/test-gasto-bateria.py
      - name: Comprobar el nombre de las descargas
        working-directory: ${{ github.workspace }}
        run: python3 scripts/test-nombre-descarga.py
      - name: Compilar APK de prueba
        run: gradle :app:assembleDebug --no-daemon
      - name: Comprobar que existe el APK
        run: |
          echo "Archivos generados:"
          find app/build/outputs -type f -maxdepth 6 -print
          test -s app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TrabakutikGPS-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
      # El artefacto de arriba solo lo puede bajar quien tenga cuenta de
      # GitHub. La Release es publica y, sobre todo, da un enlace FIJO que
      # siempre apunta a la ultima version:
      #   .../releases/latest/download/TrabakutikGPS.apk
      # Un toque y se descarga, sin cuenta y sin buscar nada.
      - name: Publicar la Release con el APK
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -o 'versionName = "[^"]*"' app/build.gradle.kts | cut -d'"' -f2)
          echo "Version: $VERSION"
          cp app/build/outputs/apk/debug/app-debug.apk TrabakutikGPS.apk
          gh release create "v$VERSION" TrabakutikGPS.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "Trabakutik GPS $VERSION" \
            --notes "Descarga directa: TrabakutikGPS.apk. Instrucciones de instalacion en https://eltzubi.github.io/trabakutik-gps-pruebas/instalar.html" \
            || gh release upload "v$VERSION" TrabakutikGPS.apk --repo "$GITHUB_REPOSITORY" --clobber
      # Y ADEMAS, EL APK EN LA PROPIA WEB. El enlace de la Release pasa por un
      # reenvio de GitHub a otro servidor, y Brave en Android se queda colgado
      # en «Descargando...» con el fichero ya entero y sin instalar nada. Lo
      # conto el autor: «siempre se queda asi». Servido desde Pages no hay
      # ningun salto y baja como cualquier otro fichero.
      # Esto NO vuelve a disparar este workflow: solo se dispara con cambios en
      # android/** y en este mismo fichero, y el APK va en la raiz.
      # Cuesta unos 2 MB en el repositorio por cada version. El autor lo sabe y
      # lo aprobo. Lo que NO vale es guardar otros 2 MB por cada recompilacion
      # de la MISMA version: la 4.9.1 se guardo seis veces el 8 y el 9 de
      # noviembre, doce megas por un numero de version que no cambiaba. Un
      # APK de debug nunca sale igual dos veces -lleva la hora dentro-, asi
      # que git veia un fichero nuevo cada vez. Ahora, si la version ya es la
      # que esta publicada en la web, el APK no se vuelve a guardar: un
      # numero de version, un APK. Para que el de la web cambie, hay que
      # subir versionName en android/app/build.gradle.kts, que es justo para
      # lo que esta. La Release si se actualiza igual, que no cuesta
      # historial.
      - name: Dejar el APK en la web de instalacion
        if: github.event_name != 'pull_request'
        run: |
          cd "$GITHUB_WORKSPACE"
          PUBLICADA=$(grep -o '<!--VER-->[^<]*<!--/VER-->' instalar.html | sed 's/<!--VER-->//; s|<!--/VER-->||')
          echo "La web sirve ahora la $PUBLICADA"
          cp android/app/build/outputs/apk/debug/app-debug.apk TrabakutikGPS.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          VERSION=$(grep -o 'versionName = "[^"]*"' android/app/build.gradle.kts | cut -d'"' -f2)
          # EL NUMERO DE VERSION EN LA WEB, PUESTO AQUI Y NO A MANO. Escrito a
          # mano se queda viejo en la primera version que se nos olvide.
          python3 - "$VERSION" <<'PY'
          import pathlib,re,sys
          v=sys.argv[1]
          p=pathlib.Path('instalar.html');t=p.read_text(encoding='utf-8')
          n=re.sub(r'(<!--VER-->).*?(<!--/VER-->)',lambda m:m.group(1)+v+m.group(2),t,flags=re.S)
          if n==t and ('<!--VER-->'+v+'<!--/VER-->') not in t:
              raise SystemExit('No esta la marca <!--VER--> en instalar.html: el numero de version no se ha puesto')
          p.write_text(n,encoding='utf-8')
          print('instalar.html: version',v)
          PY
          if [ "$PUBLICADA" = "$VERSION" ]; then
            echo "La web ya sirve la $VERSION: no se guarda otra copia del APK."
            echo "Si has cambiado el codigo de Android, sube versionName en android/app/build.gradle.kts." >> "$GITHUB_STEP_SUMMARY"
            git checkout -- TrabakutikGPS.apk 2>/dev/null || true
            exit 0
          fi
          git add TrabakutikGPS.apk instalar.html android/app/build.gradle.kts
          if git diff --cached --quiet; then
            echo "Ni el APK ni la version de la web han cambiado"
            exit 0
          fi
          git commit -m "Publicar TrabakutikGPS.apk $VERSION en la web de instalacion"
          git pull --rebase origin main
          git push origin HEAD:main

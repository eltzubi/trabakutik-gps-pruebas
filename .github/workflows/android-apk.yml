name: Compilar Trabakutik GPS APK
on:
  push:
    paths:
      - 'android/**'
      - 'nuevo.html'
      - 'data/route-metadata.json'
      - 'data/trailhead.json'
      - 'vendor/leaflet/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar SDK Android del servidor
        run: |
          echo "SDK: $ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Incluir GPS y catálogo de rutas de esta rama
        run: |
          mkdir -p app/src/main/assets
          cp ../nuevo.html app/src/main/assets/nuevo.html
          cp ../data/route-metadata.json app/src/main/assets/route-metadata.json
          mkdir -p app/src/main/assets/data
          cp ../data/trailhead.json app/src/main/assets/data/trailhead.json
          mkdir -p app/src/main/assets/vendor/leaflet
          cp ../vendor/leaflet/leaflet.css app/src/main/assets/vendor/leaflet/leaflet.css
          cp ../vendor/leaflet/leaflet.js app/src/main/assets/vendor/leaflet/leaflet.js
      - name: Compilar APK de prueba
        run: gradle :app:assembleDebug --no-daemon
      - name: Comprobar que existe el APK
        run: |
          echo "Archivos generados:"
          find app/build/outputs -type f -maxdepth 6 -print
          test -s app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TrabakutikGPS-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error

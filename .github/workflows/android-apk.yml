name: Compilar Trabakutik GPS APK
on:
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:
permissions:
  contents: write   # hace falta para publicar la Release con el APK
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar SDK Android del servidor
        run: |
          echo "SDK: $ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Preparar edición aislada para probar el PR
        if: github.event_name == 'pull_request'
        env:
          PR_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 ../scripts/test-apk-prueba.py
          python3 ../scripts/preparar-apk-prueba.py --root .. --version "$PR_COMMIT"
      - name: Compilar APK de prueba
        run: gradle :app:assembleDebug --no-daemon
      - name: Verificar la APK aislada y su interfaz
        if: github.event_name == 'pull_request'
        run: |
          python3 - <<'PY'
          import hashlib, json, os, subprocess, zipfile
          apk = 'app/build/outputs/apk/debug/app-debug.apk'
          with zipfile.ZipFile(apk) as z:
              prefix = 'assets/gps-prueba/'
              info = json.loads(z.read(prefix + 'version.json'))
              for name, digest in info['empaquetado'].items():
                  assert hashlib.sha256(z.read(prefix + name)).hexdigest() == digest, name
          aapt = os.environ['ANDROID_HOME'] + '/build-tools/35.0.0/aapt'
          badging = subprocess.check_output([aapt, 'dump', 'badging', apk], text=True)
          assert "package: name='com.trabakutik.gps.pruebas'" in badging
          assert "launchable-activity: name='com.trabakutik.gps.MainActivity'" in badging
          assert "application-label:'GPS Pruebas'" in badging
          print('APK GPS Pruebas verificada; interfaz del commit ' + info['commit'])
          PY
      - name: Comprobar que existe el APK
        run: |
          echo "Archivos generados:"
          find app/build/outputs -type f -maxdepth 6 -print
          test -s app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TrabakutikGPS-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
      # El artefacto de arriba solo lo puede bajar quien tenga cuenta de
      # GitHub. La Release es publica y, sobre todo, da un enlace FIJO que
      # siempre apunta a la ultima version:
      #   .../releases/latest/download/TrabakutikGPS.apk
      # Un toque y se descarga, sin cuenta y sin buscar nada.
      - name: Publicar la Release con el APK
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -o 'versionName = "[^"]*"' app/build.gradle.kts | cut -d'"' -f2)
          echo "Version: $VERSION"
          cp app/build/outputs/apk/debug/app-debug.apk TrabakutikGPS.apk
          gh release create "v$VERSION" TrabakutikGPS.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "Trabakutik GPS $VERSION" \
            --notes "Descarga directa: TrabakutikGPS.apk. Instrucciones de instalacion en https://eltzubi.github.io/trabakutik-gps-pruebas/instalar.html" \
            || gh release upload "v$VERSION" TrabakutikGPS.apk --repo "$GITHUB_REPOSITORY" --clobber

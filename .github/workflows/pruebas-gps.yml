name: Probar flujos GPS y copia sin conexión
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regresiones:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Probar regresiones JavaScript, service worker y vista nativa
        run: node --test scripts/test-gps.cjs
      - name: Preparar Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.64.1
          npx playwright install --with-deps chromium
      - name: Probar los flujos en navegador
        run: node scripts/test-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas-pruebas-gps
          path: .test-artifacts/
          if-no-files-found: ignore
          retention-days: 7

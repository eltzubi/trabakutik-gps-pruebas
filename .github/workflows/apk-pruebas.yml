name: APK privada de pruebas (sin modificar main)

on:
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/apk-pruebas.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk-qa:
    name: Compilar APK QA independiente
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Instalar SDK Android
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Compilar APK QA con identificador independiente
        run: gradle :app:assembleQa --no-daemon
      - name: Verificar que la APK se ha generado
        run: test -s app/build/outputs/apk/qa/app-qa.apk
      - name: Guardar APK QA para instalación privada
        uses: actions/upload-artifact@v4
        with:
          name: TrabakutikGPS-QA-Instalable
          path: android/app/build/outputs/apk/qa/app-qa.apk
          if-no-files-found: error
          retention-days: 14

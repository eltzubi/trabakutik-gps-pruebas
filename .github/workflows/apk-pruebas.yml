name: APK privada de pruebas (sin modificar main)

on:
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/apk-pruebas.yml'
  push:
    branches: [auditoria-gps-giros-ci-20261106]
    paths:
      - 'android/**'
      - '.github/workflows/apk-pruebas.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk-qa:
    name: Compilar APK QA independiente
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Instalar SDK Android
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Generar prueba de instrucciones nativas
        working-directory: .
        run: python3 scripts/test-native-turns.py --generate-junit
      - name: Verificar giros y compilar APK QA
        run: |
          gradle :app:testDebugUnitTest --no-daemon
          gradle :app:assembleQa --no-daemon
      - name: Verificar que la APK se ha generado
        run: test -s app/build/outputs/apk/qa/app-qa.apk
      - name: Guardar APK QA para instalación privada
        uses: actions/upload-artifact@v4
        with:
          name: TrabakutikGPS-QA2-Giros-Instalable
          path: android/app/build/outputs/apk/qa/app-qa.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publicar APK QA como prerelease independiente
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/qa/app-qa.apk TrabakutikGPS-QA2-Giros.apk
          gh release create qa2-giros-20261106 TrabakutikGPS-QA2-Giros.apk \
            --repo "$GITHUB_REPOSITORY" --title "Trabakutik GPS QA2 · giros" \
            --notes "Aplicación de pruebas independiente (com.trabakutik.gps.qa2). No sustituye la estable. Avisos de giros y cruces." \
            --prerelease || gh release upload qa2-giros-20261106 TrabakutikGPS-QA2-Giros.apk \
            --repo "$GITHUB_REPOSITORY" --clobber

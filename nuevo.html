function startGPS(){if(watch!==null)return;if(!navigator.geolocation){notice('Activa ubicación y permite el acceso desde el navegador');return}getAudio();notice('Localizando…');watch=navigator.geolocation.watchPosition(onFix,e=>{notice('Activa la ubicación del móvil y concede permiso al navegador: '+e.message);if(watch!==null)navigator.geolocation.clearWatch(watch);watch=null;},{enableHighAccuracy:true,maximumAge:1000,timeout:20000})}
$('navGo').onclick=startGPS;$('locate').onclick=()=>{if(position)map.setView(position,16);else startGPS()};$('plus').onclick=()=>map.zoomIn();$('minus').onclick=()=>map.zoomOut();
function recordingControls(state){
 $('recordStart').classList.toggle('hidden',state!=='ready');
 $('recordStop').classList.toggle('hidden',state!=='recording');
 $('saveRecording').classList.toggle('hidden',state!=='stopped');
 $('discardRecording').classList.toggle('hidden',state!=='stopped');
 $('saveRecording').disabled=recorded.length<2;
}
$('recordStart').onclick=()=>{if(watch===null)startGPS();recorded=[];recording=true;if(recordLayer){map.removeLayer(recordLayer);recordLayer=null}recordingControls('recording');notice('Grabando recorrido · pulsa Parar al terminar')};
$('recordStop').onclick=()=>{recording=false;recordingControls('stopped');notice(recorded.length<2?'Grabación detenida · faltan 2 posiciones para guardar GPX':'Grabación detenida · Guardar GPX o Descartar')};
$('saveRecording').onclick=()=>{if(recorded.length<2)return;download(recorded,'trabakutik-grabacion');notice('Descarga GPX iniciada · comprueba Descargas');recorded=[];if(recordLayer){map.removeLayer(recordLayer);recordLayer=null}recordingControls('ready')};
$('discardRecording').onclick=()=>{if(!confirm('¿Descartar esta grabación? Se borrará el recorrido sin guardarlo.'))return;recording=false;recorded=[];if(recordLayer){map.removeLayer(recordLayer);recordLayer=null}recordingControls('ready');notice('Grabación descartada')};
window.addEventListener('beforeunload',e=>{if(recording){e.preventDefault();e.returnValue=''}});
fetch('data/trailhead.json').then(r=>r.json()).then(data=>{tracks=data.tracks.filter(t=>t.points?.length>1);const slug=new URLSearchParams(location.search).get('ruta');const n=slug?tracks.findIndex(t=>t.href.replace(/\.html$/,'')===slug.replace(/\.html$/,'')):-1;if(n>=0)selectRoute(n);else{drawAll();map.setView([43.19,-2.55],12);notice('Elige una ruta desde Trabakutik o pulsa Iniciar GPS')} }).catch(e=>notice('No se han podido cargar las rutas: '+e.message));
})();

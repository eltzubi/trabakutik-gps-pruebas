<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#07131d"><title>Trabakutik · Navegador nuevo</title><link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<style>
:root{font-family:system-ui,-apple-system,Arial,sans-serif;color:#e6f4ff;background:#07131d}*{box-sizing:border-box}body{margin:0}button{font:inherit;cursor:pointer;touch-action:manipulation}button:disabled{opacity:.4;cursor:default}#app{height:100dvh;display:flex;flex-direction:column;overflow:hidden}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(7px + env(safe-area-inset-top)) 12px 8px;background:#0a1b27;border-bottom:1px solid #284456;min-height:62px}.top strong{font-size:13px;font-weight:760;letter-spacing:.05em}.top small{font-size:10px;color:#91b4c4;display:block}.top .sub{font-size:11px;color:#a6eefe;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:55vw}.top a{color:#9ed9e7;font-size:11px;text-decoration:none}#map{position:relative;flex:1;min-height:0;background:#172d33}.leaflet-container{background:#172d33}.leaflet-control-attribution{font-size:9px!important}.tools{position:absolute;z-index:700;right:10px;top:12px;display:grid;gap:7px}.tools button{width:42px;height:42px;border:1px solid #5a889b7a;border-radius:13px;background:#0d2339ed;color:#d4f7ff;font-size:21px;box-shadow:0 2px 14px #0006}.info{position:absolute;z-index:700;left:10px;top:12px;max-width:calc(100% - 80px);background:#0a1f2edb;border:1px solid #31576a;border-radius:13px;padding:9px 12px;backdrop-filter:blur(12px);pointer-events:none}.info b{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.info span{display:block;font-size:10px;color:#a5bece;margin-top:4px}.bottom{background:#091925;border-top:1px solid #315265;padding:8px 9px calc(9px + env(safe-area-inset-bottom));flex:none}.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-bottom:8px}.modes button{background:#122e3d;border:1px solid #2d5261;color:#acccd9;border-radius:12px;padding:9px 4px;font-size:12px;font-weight:650}.modes button[aria-pressed=true]{color:#051824;background:#66e5ff;border-color:#66e5ff}.actions{display:flex;gap:6px;align-items:center;justify-content:center;min-height:44px}.actions button{min-height:43px;flex:1;padding:9px 8px;background:#173346;color:#f3fcff;border:1px solid #3f6375;border-radius:12px;font-size:12px;font-weight:700}.actions .go{background:#92fca8;color:#06271b;border-color:#92fca8}.actions .red{background:#e95164;color:#fff;border-color:#e95164}.actions .blue{background:#338be9;color:#fff;border-color:#338be9}.actions .amber{background:#ffbd69;color:#2d1804;border-color:#ffbd69}.actions .light{background:#123046}.hidden{display:none!important}.status{font-size:10px;color:#a7bfcb;margin-top:6px;text-align:center;min-height:13px}.legend{font-size:10px;color:#9cb8c7;display:flex;justify-content:center;gap:12px;margin-top:6px}.dot{width:15px;height:3px;display:inline-block;vertical-align:middle;margin-right:3px}.popup{position:absolute;z-index:900;inset:0;background:#07131dba;display:grid;place-items:end center}.sheet{width:100%;max-height:77%;overflow:auto;background:#102938;border:1px solid #365467;border-radius:19px 19px 0 0;padding:16px 14px 24px}.sheet h2{font-size:16px;margin:0 0 9px}.sheet input{width:100%;border-radius:10px;background:#173747;border:1px solid #638092;color:white;padding:12px;margin-bottom:9px}.sheet button{background:#163a4c;color:white;border:1px solid #4d7385;border-radius:10px;padding:10px}.routeitem{display:flex;justify-content:space-between;align-items:center;width:100%;gap:8px;text-align:left;margin:5px 0;font-size:12px}.routeitem span{font-size:10px;color:#a4c3d2}.sheet .close{float:right}.on-map{position:absolute;bottom:10px;left:10px;z-index:700;border-radius:99px;padding:7px 11px;font-size:11px;background:#0b293bdd;color:#a5e3f3;border:1px solid #3d7485;pointer-events:none}@media(min-width:800px){#app{max-width:900px;margin:auto;border-left:1px solid #1e4453;border-right:1px solid #1e4453}.top{padding-top:12px}}
</style></head><body><div id="app">
<header class="top"><div><strong>TRABAKUTIK <span style="color:#70eaff">GPS</span></strong><small id="title">Elige una ruta</small></div><a href="https://trabakutik.com/">← Volver a la web</a></header>
<div id="map" aria-label="Mapa de todas las rutas"><div class="tools"><button id="locate" title="Mi posición" aria-label="Centrar en mi posición">⌖</button><button id="plus" aria-label="Acercar">+</button><button id="minus" aria-label="Alejar">−</button></div><div class="info"><b id="mapTitle">Mapa de rutas</b><span id="distance">Ruta destacada en cian</span></div><span class="on-map" id="drawTip" hidden>Toca las líneas para marcar puntos azules</span></div>
<footer class="bottom"><div class="modes"><button id="modeNav" aria-pressed="true">⌖ Navegar</button><button id="modeCreate" aria-pressed="false">✎ Crear</button><button id="modeRecord" aria-pressed="false">⏺ Grabar</button></div><div class="actions" id="navActions"><button id="choose">Elegir ruta</button><button class="go" id="navGo">Iniciar GPS</button></div><div class="actions hidden" id="createActions"><button id="undo" disabled>↶ Deshacer</button><button class="blue" id="saveCreated" disabled>Guardar GPX</button><button class="go" id="navCreated" disabled>Navegar</button></div><div class="actions hidden" id="recordActions"><button class="go" id="recordStart">⏺ Grabar</button><button class="red hidden" id="recordStop">■ Parar</button><button class="blue hidden" id="saveRecording" disabled>↓ Guardar GPX</button></div><div class="legend"><span><i class="dot" style="background:#5bebff"></i>Elegida</span><span><i class="dot" style="background:#8d9dac"></i>Otras</span><span><i class="dot" style="background:#5d8eff"></i>Creada</span></div><div class="status" id="status">Mapa listo · GPS al pulsar Iniciar</div></footer>
<div id="routeDialog" class="popup hidden"><div class="sheet"><button class="close" id="closeDialog">✕</button><h2>Elegir ruta de Trabakutik</h2><input id="search" placeholder="Buscar por nombre…" autocomplete="off"><div id="items"></div></div></div>
</div><script src="vendor/leaflet/leaflet.js"></script><script>
(()=>{'use strict';
const $=id=>document.getElementById(id),R=Math.PI/180,toName=t=>t.href.replace(/\.html$/,'').replace(/[-_]/g,' '),fmt=m=>m>=1000?(m/1000).toFixed(2)+' km':Math.round(m)+' m';
const map=L.map('map',{zoomControl:false,preferCanvas:true}).setView([43.19,-2.55],12);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
let tracks=[],layers=[],chosen=-1,mode='nav',watch=null,position=null,me=null,routePoints=[],drawPoints=[],drawSteps=[],drawMarks=[],drawLayer=null,recorded=[],recording=false,recordLayer=null,alerted=false,farCount=0,audio=null;
const dist=(a,b)=>{const y=(a[0]-b[0])*R,x=(a[1]-b[1])*R;return 6371000*2*Math.asin(Math.min(1,Math.sqrt(Math.sin(y/2)**2+Math.cos(a[0]*R)*Math.cos(b[0]*R)*Math.sin(x/2)**2)))};
const notice=t=>{$('status').textContent=t};
function drawAll(){layers.forEach(l=>map.removeLayer(l));layers=[];tracks.forEach((t,i)=>{const l=L.polyline(t.points.map(p=>[p[0],p[1]]),{color:i===chosen?'#5bebff':'#8d9dac',weight:i===chosen?5:2,opacity:i===chosen?1:.37,interactive:false}).addTo(map);layers.push(l)});if(chosen>=0){map.fitBounds(layers[chosen].getBounds(),{padding:[35,35]});$('title').textContent=toName(tracks[chosen]);$('mapTitle').textContent=toName(tracks[chosen]);$('distance').textContent='Cian: tu ruta · Gris: demás rutas'}}
function selectRoute(i){chosen=i;routePoints=tracks[i].points.map(p=>[p[0],p[1]]);drawAll();$('routeDialog').classList.add('hidden');notice('Ruta cargada. Inicia GPS para seguirla.')}
function showRoutes(){const q=$('search').value.toLowerCase().trim();const list=$('items');list.replaceChildren();let n=0;tracks.forEach((t,i)=>{if(!toName(t).toLowerCase().includes(q))return;n++;const b=document.createElement('button');b.className='routeitem';b.textContent=toName(t);const mark=document.createElement('span');mark.textContent=i===chosen?'Seleccionada':'Ver';b.append(mark);b.onclick=()=>selectRoute(i);list.append(b)});if(!n)list.textContent='Sin coincidencias'}
$('choose').onclick=()=>{$('routeDialog').classList.remove('hidden');showRoutes()};$('closeDialog').onclick=()=>$('routeDialog').classList.add('hidden');$('search').oninput=showRoutes;
function changeMode(m){mode=m;for(const [key,b] of [['nav','modeNav'],['create','modeCreate'],['record','modeRecord']])$(b).setAttribute('aria-pressed',String(m===key));for(const [key,id] of [['nav','navActions'],['create','createActions'],['record','recordActions']])$(id).classList.toggle('hidden',m!==key);$('drawTip').hidden=m!=='create';notice(m==='create'?'Toca un trazado para añadir bolitas azules':m==='record'?'Graba tu recorrido real y guárdalo':'Elige una ruta y pulsa Iniciar GPS');map.closePopup();setTimeout(()=>map.invalidateSize(),60)}
$('modeNav').onclick=()=>changeMode('nav');$('modeCreate').onclick=()=>changeMode('create');$('modeRecord').onclick=()=>changeMode('record');
function closest(p,restrict=-1){const point=map.latLngToContainerPoint(p);let hit=null;tracks.forEach((t,n)=>{if(restrict>=0&&n!==restrict)return;for(let i=0;i<t.points.length;i++){const screen=map.latLngToContainerPoint(t.points[i]);const d=point.distanceTo(screen);if(d<32&&(!hit||d<hit.d))hit={n,i,d}}});return hit}
function updateDraw(){drawMarks.forEach(x=>map.removeLayer(x));drawMarks=[];if(drawLayer)map.removeLayer(drawLayer);drawLayer=null;if(drawPoints.length)drawLayer=L.polyline(drawPoints,{color:'#538bff',weight:5}).addTo(map);drawSteps.forEach(s=>{const p=tracks[s.n].points[s.i];drawMarks.push(L.circleMarker([p[0],p[1]],{radius:6,color:'#fff',weight:2,fillColor:'#4d91ff',fillOpacity:1,interactive:false}).addTo(map))});$('undo').disabled=!drawSteps.length;$('saveCreated').disabled=drawPoints.length<2;$('navCreated').disabled=drawPoints.length<2}
function rebuildDraw(){drawPoints=[];for(let n=0;n<drawSteps.length;n++){const step=drawSteps[n],p=tracks[step.n].points;if(n===0){drawPoints.push(p[step.i].slice(0,2));continue}const prev=drawSteps[n-1];if(prev.n===step.n){const sign=step.i>=prev.i?1:-1;for(let j=prev.i+sign;sign>0?j<=step.i:j>=step.i;j+=sign)drawPoints.push(p[j].slice(0,2))}else drawPoints.push(p[step.i].slice(0,2))}updateDraw()}
map.on('click',e=>{if(mode!=='create'||!tracks.length)return;const last=drawSteps.at(-1);const hit=closest(e.latlng,last?.n??-1)||closest(e.latlng);if(!hit){notice('Amplía el mapa y toca más cerca de un track');return}if(last&&last.n!==hit.n){const a=tracks[last.n].points[last.i],b=tracks[hit.n].points[hit.i];if(dist(a,b)>15){notice('No hay enlace comprobado entre esos puntos. Busca un cruce real.');return}}if(last&&last.n===hit.n&&last.i===hit.i)return;drawSteps.push(hit);rebuildDraw();notice(drawSteps.length+' puntos azules · Sigue tocando los tracks')});
$('undo').onclick=()=>{drawSteps.pop();rebuildDraw()};
function gpx(points,name){return '<?xml version="1.0" encoding="utf-8"?><gpx xmlns="http://www.topografix.com/GPX/1/1" version="1.1" creator="Trabakutik"><trk><name>'+name+'</name><trkseg>'+points.map(p=>'<trkpt lat="'+p[0]+'" lon="'+p[1]+'"/>').join('')+'</trkseg></trk></gpx>'}
function download(points,name){if(points.length<2)return;const url=URL.createObjectURL(new Blob([gpx(points,name)],{type:'application/gpx+xml'})),a=document.createElement('a');a.href=url;a.download=name+'.gpx';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000)}
$('saveCreated').onclick=()=>{download(drawPoints,'trabakutik-creado');notice('GPX creado · comprueba Descargas')};$('navCreated').onclick=()=>{routePoints=drawPoints.slice();chosen=-1;changeMode('nav');$('mapTitle').textContent='Mi recorrido creado';$('title').textContent='Ruta creada';notice('Pulsa Iniciar GPS para navegar tu track azul')};
function getAudio(){try{if(!audio)audio=new (window.AudioContext||window.webkitAudioContext)();audio.resume().catch(()=>{})}catch(e){}}
function beep(){if(!audio)return;const t=audio.currentTime;for(let i=0;i<3;i++){const o=audio.createOscillator(),g=audio.createGain(),at=t+i*.32;o.frequency.value=850;g.gain.setValueAtTime(.0001,at);g.gain.linearRampToValueAtTime(.13,at+.02);g.gain.exponentialRampToValueAtTime(.0001,at+.19);o.connect(g);g.connect(audio.destination);o.start(at);o.stop(at+.2)}}
function closestMeters(p,path){let best=Infinity;for(let i=1;i<path.length;i++){const a=path[i-1],b=path[i];const latScale=111195,lonScale=latScale*Math.cos(p[0]*R),ax=(a[1]-p[1])*lonScale,ay=(a[0]-p[0])*latScale,bx=(b[1]-p[1])*lonScale,by=(b[0]-p[0])*latScale,dx=bx-ax,dy=by-ay,t=Math.max(0,Math.min(1,-(ax*dx+ay*dy)/(dx*dx+dy*dy||1)));best=Math.min(best,Math.hypot(ax+t*dx,ay+t*dy))}return best}
function onFix(pos){const p=[pos.coords.latitude,pos.coords.longitude],prior=position;position=p;const h=Number.isFinite(pos.coords.heading)&&pos.coords.heading>=0?pos.coords.heading:null;const icon=L.divIcon({className:'',iconSize:[36,36],iconAnchor:[18,18],html:'<div style="width:36px;height:36px;display:grid;place-items:center;transform:rotate('+(h??0)+'deg)"><svg width="36" height="36" viewBox="0 0 36 36"><circle cx="18" cy="18" r="12" fill="#187cff" stroke="white" stroke-width="3"/>'+(h!==null?'<path d="M18 0L10 15L18 12L26 15Z" fill="#187cff" stroke="white" stroke-width="1.5"/>':'')+'</svg></div>'});if(!me)me=L.marker(p,{icon,zIndexOffset:1000}).addTo(map);else{me.setLatLng(p);me.setIcon(icon)}if(!prior||dist(prior,p)>4)map.panTo(p,{animate:false});if(!prior&&map.getZoom()<15)map.setZoom(16);
 if(recording){if(!recorded.length||dist(recorded.at(-1),p)>2){recorded.push(p);if(recordLayer)recordLayer.setLatLngs(recorded);else recordLayer=L.polyline(recorded,{color:'#ffad66',weight:5}).addTo(map)}}
 if(mode==='nav'&&routePoints.length>1){const d=closestMeters(p,routePoints);$('distance').textContent='A '+fmt(d)+' del track';if(pos.coords.accuracy<=15){if(d>15){farCount++;if(farCount>=3&&!alerted){alerted=true;beep()}}else{farCount=0;alerted=false}}else farCount=0;if(alerted)notice('Fuera del recorrido · vuelve a la línea cian')}else if(mode==='nav')notice('Ubicación encontrada · selecciona una ruta')}
function startGPS(){if(watch!==null)return;if(!navigator.geolocation){notice('Activa ubicación y permite el acceso desde el navegador');return}getAudio();notice('Localizando…');watch=navigator.geolocation.watchPosition(onFix,e=>{notice('Activa la ubicación del móvil y concede permiso al navegador: '+e.message);if(watch!==null)navigator.geolocation.clearWatch(watch);watch=null;},{enableHighAccuracy:true,maximumAge:1000,timeout:20000})}
$('navGo').onclick=startGPS;$('locate').onclick=()=>{if(position)map.setView(position,16);else startGPS()};$('plus').onclick=()=>map.zoomIn();$('minus').onclick=()=>map.zoomOut();
$('recordStart').onclick=()=>{if(watch===null)startGPS();recorded=[];recording=true;if(recordLayer){map.removeLayer(recordLayer);recordLayer=null}$('recordStart').classList.add('hidden');$('recordStop').classList.remove('hidden');$('saveRecording').classList.add('hidden');notice('Grabando · mantén la pantalla encendida')};
$('recordStop').onclick=()=>{recording=false;$('recordStart').classList.remove('hidden');$('recordStop').classList.add('hidden');$('saveRecording').classList.remove('hidden');$('saveRecording').disabled=recorded.length<2;notice(recorded.length<2?'Faltan posiciones GPS para guardar':'Grabación parada · puedes guardar GPX')};
$('saveRecording').onclick=()=>{download(recorded,'trabakutik-grabacion');notice('GPX descargado')};
window.addEventListener('beforeunload',e=>{if(recording){e.preventDefault();e.returnValue=''}});
fetch('data/trailhead.json').then(r=>r.json()).then(data=>{tracks=data.tracks.filter(t=>t.points?.length>1);const slug=new URLSearchParams(location.search).get('ruta');const n=slug?tracks.findIndex(t=>t.href.replace(/\.html$/,'')===slug.replace(/\.html$/,'')):-1;if(n>=0)selectRoute(n);else{drawAll();map.setView([43.19,-2.55],12);notice('Elige una ruta desde Trabakutik o pulsa Iniciar GPS')} }).catch(e=>notice('No se han podido cargar las rutas: '+e.message));
})();
</script></body></html>

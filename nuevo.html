              Math.round(p[1] * KX / CELDA_M);

  }

function elevationText(points){
 let up=0,down=0;
 for(let i=1;i<points.length;i++){
  if(!Number.isFinite(points[i][2])||!Number.isFinite(points[i-1][2]))continue;
  const difference=points[i][2]-points[i-1][2];
  if(difference>=5)up+=difference;else if(difference<=-5)down-=difference;
 }
 return points.some(p=>Number.isFinite(p[2]))?' · +'+Math.round(up)+' / -'+Math.round(down)+' m aprox.':' · sin alturas disponibles';
}
function loadSaved(item){
 resetOffRoute();routePoints=item.points.map(p=>p.slice());chosen=-1;
 $('savedDialog').classList.add('hidden');changeMode('nav');
 
 if(savedLine)map.removeLayer(savedLine);
 savedLine=L.polyline(routePoints,{color:'#5bebff',weight:8,opacity:1,interactive:false}).addTo(map).bringToFront();
 map.fitBounds(savedLine.getBounds(),{padding:[35,35]});
 $('title').textContent=item.name;$('mapTitle').textContent=item.name;
 $('distance').textContent='Ruta propia'+elevationText(routePoints);
 computeJunctions();syncNativeRoute();notice('Ruta cargada. Pulsa Iniciar GPS para seguirla.');
}
let savedLine=null;
function showSaved(){
 const target=$('savedItems');target.replaceChildren();
 const list=savedList();
 if(!list.length){target.textContent='Aún no hay rutas guardadas. Créala y pulsa Guardar GPX.';return}
 list.forEach((item,i)=>{
  const row=document.createElement('div');row.className='routeitem';
  const open=document.createElement('button');open.textContent=item.name+' · '+item.points.length+' puntos'+elevationText(item.points);open.style.flex='1';open.onclick=()=>loadSaved(item);
  const del=document.createElement('button');del.textContent='Eliminar';del.onclick=()=>{if(!confirm('¿Eliminar esta ruta guardada?'))return;list.splice(i,1);putSaved(list);showSaved()};
  row.append(open,del);target.append(row);
 });
}
$('savedRoutes').onclick=()=>{$('savedDialog').classList.remove('hidden');showSaved()};
$('closeSaved').onclick=()=>$('savedDialog').classList.add('hidden');
$('saveCreated').onclick=()=>{
 if(drawPoints.length<2)return;
 const name=prompt('Nombre para guardar la ruta','Mi ruta '+new Date().toLocaleDateString('es-ES'));
 if(name===null)return;
 const finalName=name.trim()||'Mi ruta';
 const points=drawPoints.map(p=>p.slice());
 const list=savedList();list.unshift({name:finalName,points,created:Date.now()});
 const stored=putSaved(list.slice(0,30));
 download(points,finalName.toLowerCase().replace(/[^a-z0-9áéíóúüñ-]+/gi,'-'));
 notice((stored?'Ruta guardada en Mis rutas y GPX descargado.':'GPX descargado.')+elevationText(points));
};
$('navCreated').onclick=()=>{
 if(drawPoints.length<2)return;
 loadSaved({name:'Mi recorrido creado',points:drawPoints});
};
// El aviso se arma cuando el usuario ya ha llegado al recorrido.
// Se basa en tiempo y precisión, no en un número de lecturas consecutivas.
function resetOffRoute(){alerted=false;farCount=0;farSince=0;onRouteSeen=false}
function updateOffRoute(d,accuracy){
 if(!Number.isFinite(d)||!Number.isFinite(accuracy))return;
 // Evitar falsos positivos debidos a posiciones GPS imprecisas.
 if(accuracy>22){farSince=0;return}
 const near=d<=Math.max(14,accuracy+4);
 if(near){onRouteSeen=true;farSince=0;if(alerted){alerted=false;notice('De nuevo en la ruta')}return}
 if(!onRouteSeen)return; // No avisar mientras nos acercamos al inicio.
 const far=d>Math.max(18,accuracy+7);
 if(!far){farSince=0;return}
 if(!farSince)farSince=Date.now();
 if(!alerted&&Date.now()-farSince>=800){alerted=true;getAudio();beep();notice('Fuera del recorrido · vuelve a la línea cian')}
}
function getAudio(){try{if(!audio)audio=new (window.AudioContext||window.webkitAudioContext)();audio.resume().catch(()=>{})}catch(e){}}
function beep(){if(!audio)return;const t=audio.currentTime;for(let i=0;i<3;i++){const o=audio.createOscillator(),g=audio.createGain(),at=t+i*.32;o.frequency.value=850;g.gain.setValueAtTime(.0001,at);g.gain.linearRampToValueAtTime(.13,at+.02);g.gain.exponentialRampToValueAtTime(.0001,at+.19);o.connect(g);g.connect(audio.destination);o.start(at);o.stop(at+.2)}}
function closestMeters(p,path){let best=Infinity;for(let i=1;i<path.length;i++){const a=path[i-1],b=path[i];const latScale=111195,lonScale=latScale*Math.cos(p[0]*R),ax=(a[1]-p[1])*lonScale,ay=(a[0]-p[0])*latScale,bx=(b[1]-p[1])*lonScale,by=(b[0]-p[0])*latScale,dx=bx-ax,dy=by-ay,t=Math.max(0,Math.min(1,-(ax*dx+ay*dy)/(dx*dx+dy*dy||1)));best=Math.min(best,Math.hypot(ax+t*dx,ay+t*dy))}return best}

// Cruces: solo se consideran giros marcados de la ruta con otra rama registrada
// en los tracks. No se inventan instrucciones de giro.
function computeJunctions(){
 junctions=[];junctionWarned.clear();junctionZoom=null;
 if(routePoints.length<7)return;
 const pts=routePoints;
 for(let i=3;i<pts.length-3;i++){
  const a=pts[i-3],b=pts[i],c=pts[i+3];
  if(dist(a,b)<10||dist(b,c)<10)continue;
  const latitude=b[0]*R,kx=Math.cos(latitude);
  const v1=[(b[1]-a[1])*kx,b[0]-a[0]],v2=[(c[1]-b[1])*kx,c[0]-b[0]];
  const cosine=(v1[0]*v2[0]+v1[1]*v2[1])/(Math.hypot(...v1)*Math.hypot(...v2));
  const angle=Math.acos(Math.max(-1,Math.min(1,cosine)))*180/Math.PI;
  if(angle<48)continue;
  // Exige una bifurcación cartografiada de otro track cerca del giro.
  let branch=false;
  for(const t of tracks){
   if(branch)break;
   for(let j=1;j<t.points.length-1;j+=2){
    const p=t.points[j];if(dist(p,b)>12)continue;
    const before=t.points[Math.max(0,j-2)],after=t.points[Math.min(t.points.length-1,j+2)];
    if(dist(before,b)>20||dist(after,b)>20){branch=true;break}
   }
  }
  if(!branch)continue;
  if(junctions.length&&dist(junctions.at(-1).point,b)<35)continue;
  junctions.push({i,point:b});
 }
}
function shortJunctionBeep(){
 if(!audio)return;
 const t=audio.currentTime,o=audio.createOscillator(),g=audio.createGain();
 o.frequency.value=880;g.gain.setValueAtTime(.0001,t);
 g.gain.linearRampToValueAtTime(.13,t+.015);
 g.gain.exponentialRampToValueAtTime(.0001,t+.22);
 o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+.23);
}
function junctionGuidance(p,accuracy){
 if(mode!=='nav'||!routePoints.length||accuracy>12||!junctions.length)return;
 let nearest=null;
 for(let j=0;j<junctions.length;j++){
  const d=dist(p,junctions[j].point);
  if(d<40&&(!nearest||d<nearest.d))nearest={j,d};
 }
 if(nearest&&nearest.d<=35){
  if(junctionZoom===null)junctionZoom=map.getZoom();
  if(map.getZoom()<18)map.setZoom(18,{animate:true});
  // Solo un aviso por cruce, cuando el GPS entra aproximadamente
  // en la zona de 10 m; no confundirlo con el aviso de desviación (3 pitidos).
  if(nearest.d<=12&&nearest.d>=4&&!junctionWarned.has(nearest.j)){
   junctionWarned.add(nearest.j);shortJunctionBeep();
   notice('Cruce importante próximo · sigue la línea azul');
  }
 }else if(junctionZoom!==null){
  map.setZoom(junctionZoom,{animate:true});junctionZoom=null;
 }
}
function onFix(pos){const p=[pos.coords.latitude,pos.coords.longitude],prior=position;position=p;const h=Number.isFinite(pos.coords.heading)&&pos.coords.heading>=0?pos.coords.heading:null;const icon=L.divIcon({className:'',iconSize:[36,36],iconAnchor:[18,18],html:'<div style="width:36px;height:36px;display:grid;place-items:center;transform:rotate('+(h??0)+'deg)"><svg width="36" height="36" viewBox="0 0 36 36"><circle cx="18" cy="18" r="12" fill="#187cff" stroke="white" stroke-width="3"/>'+(h!==null?'<path d="M18 0L10 15L18 12L26 15Z" fill="#187cff" stroke="white" stroke-width="1.5"/>':'')+'</svg></div>'});if(!me)me=L.marker(p,{icon,zIndexOffset:1000}).addTo(map);else{me.setLatLng(p);me.setIcon(icon)}if(!prior||dist(prior,p)>4)map.panTo(p,{animate:false});if(!prior&&map.getZoom()<15)map.setZoom(16);
 if(recording){if(!recorded.length||dist(recorded.at(-1),p)>2){recorded.push(p);if(recordLayer){recordLayer.setLatLngs(recorded);recordLayer.bringToFront()}else recordLayer=L.polyline(recorded,{color:'#ff354c',weight:6.5,opacity:1,interactive:false,lineCap:'round',lineJoin:'round',className:'recorded-red'}).addTo(map).bringToFront()}}
 if(mode==='nav'&&routePoints.length>1){junctionGuidance(p,pos.coords.accuracy);const d=closestMeters(p,routePoints);$('distance').textContent='A '+fmt(d)+' del track';if(!window.TrabakutikAndroid)updateOffRoute(d,pos.coords.accuracy);if(alerted)notice('Fuera del recorrido · vuelve a la línea cian')}else if(mode==='nav')notice('Ubicación encontrada · selecciona una ruta')}
function syncNativeRoute(){try{if(window.TrabakutikAndroid&&routePoints.length>1)window.TrabakutikAndroid.setRoute(JSON.stringify(routePoints.map(p=>[p[0],p[1]])))}catch(e){console.warn('Ruta nativa no enviada',e)}}
function startGPS(forRecording=false){if(!forRecording&&window.TrabakutikAndroid){syncNativeRoute();try{window.TrabakutikAndroid.startNavigation()}catch(e){console.warn(e)}}if(watch!==null)return;if(!navigator.geolocation){notice('Activa ubicación y permite el acceso desde el navegador');return}getAudio();notice('Localizando…');watch=navigator.geolocation.watchPosition(onFix,e=>{notice('Activa la ubicación del móvil y concede permiso al navegador: '+e.message);if(watch!==null)navigator.geolocation.clearWatch(watch);watch=null;},{enableHighAccuracy:true,maximumAge:1000,timeout:20000})}
$('navGo').onclick=startGPS;$('locate').onclick=()=>{if(position)map.setView(position,16);else startGPS()};$('plus').onclick=()=>map.zoomIn();$('minus').onclick=()=>map.zoomOut();
function recordingControls(state){document.body.classList.toggle('is-recording',state==='recording');
 $('recordStart').classList.toggle('hidden',state!=='ready');
 $('recordStop').classList.toggle('hidden',state!=='recording');
 $('saveRecording').classList.toggle('hidden',state!=='stopped');
 $('discardRecording').classList.toggle('hidden',state!=='stopped');
 $('saveRecording').disabled=state==='stopped'&&!window.TrabakutikAndroid&&recorded.length<2;
}
$('recordStart').onclick=()=>{if(window.TrabakutikAndroid)window.TrabakutikAndroid.clearRoute();if(watch===null)startGPS(true);if(window.TrabakutikAndroid)window.TrabakutikAndroid.startRecording();recorded=[];recording=true;if(recordLayer){map.removeLayer(recordLayer);recordLayer=null}recordingControls('recording');notice('Grabando recorrido · pulsa Parar al terminar')};
$('recordStop').onclick=()=>{if(window.TrabakutikAndroid)window.TrabakutikAndroid.stopRecording();recording=false;recordingControls('stopped');notice(recorded.length<2?'Grabación detenida · faltan 2 posiciones para guardar GPX':'Grabación detenida · Guardar GPX o Descartar')};
$('saveRecording').onclick=()=>{if(window.TrabakutikAndroid){window.TrabakutikAndroid.saveRecording();notice('Elige dónde guardar el archivo GPX');return}else{if(recorded.length<2)return;download(recorded,'trabakutik-grabacion')}notice('Descarga GPX iniciada · comprueba Descargas');recorded=[];if(recordLayer){map.removeLayer(recordLayer);recordLayer=null}recordingControls('ready')};
$('discardRecording').onclick=()=>{if(!confirm('¿Descartar esta grabación? Se borrará el recorrido sin guardarlo.'))return;if(window.TrabakutikAndroid)window.TrabakutikAndroid.discardRecording();recording=false;recorded=[];if(recordLayer){map.removeLayer(recordLayer);recordLayer=null}recordingControls('ready');notice('Grabación descartada')};
window.trabakutikNativeGpxSaved=()=>{
 if(mode==='record'&&!recording&&recorded.length){
  recorded=[];if(recordLayer){map.removeLayer(recordLayer);recordLayer=null}
  recordingControls('ready');notice('GPX guardado en el móvil');
 }
};
window.addEventListener('beforeunload',e=>{if(recording){e.preventDefault();e.returnValue=''}});
fetch('data/trailhead.json').then(r=>r.json()).then(data=>{tracks=data.tracks.filter(t=>t.points?.length>1);const slug=new URLSearchParams(location.search).get('ruta');const n=slug?tracks.findIndex(t=>t.href.replace(/\.html$/,'')===slug.replace(/\.html$/,'')):-1;if(n>=0)selectRoute(n);else{drawAll();map.setView([43.19,-2.55],12);notice('Elige una ruta desde Trabakutik o pulsa Iniciar GPS')} }).catch(e=>notice('No se han podido cargar las rutas: '+e.message));
})();
</script></body></html>
